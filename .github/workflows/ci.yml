name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pytest>=8"
      - name: tests (unit, API, concurrency, CLI, docker restart)
        run: python -m pytest -q
  client-py38:
    # the single-file client must run on old Pythons (Jetson images, old distros)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: py38
        with:
          python-version: "3.8"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pytest>=8"
      - name: CLI + concurrency tests with the client on Python 3.8
        env:
          HWLOCK_CLIENT_PYTHON: ${{ steps.py38.outputs.python-path }}
        run: python -m pytest -q tests/test_cli.py tests/test_concurrency.py
